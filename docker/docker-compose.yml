services:
  intellibridge:
    image: intellibridge:latest
    container_name: intellibridge
    ports:
      - "49000:49000"
    environment:
      - MEM0_TELEMETRY=False
    volumes:
      - ./config:/app/config
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - neo4j
    restart: unless-stopped

  neo4j:
    image: neo4j:latest
    container_name: intellibridge-neo4j
    ports:
      - "10000:7474"
      - "12345:7687"
    environment:
      NEO4J_AUTH: neo4j/intellibridge_graph123
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
    restart: unless-stopped