# IntelliBridge 配置文件

# Hive 连接配置
hive:
  host: "localhost"
  port: 10000
  username: "hive"
  database: "default"

# Agent Browser 配置
agent_browser:
  cdp_port: 3000

# MySQL 连接配置
mysql:
  nodes:
    - name: local_node
      host: "localhost"
      port: 3306
      username: "intellibridge"
      password: "intellibridge_password"
      charset: "utf8mb4"
      databases:
        - name: intellibridge
          description: "主数据库，用于系统核心数据存储"

    # 示例：多节点配置（同名数据库需使用不同节点名区分）
    # - name: nodeA
    #   host: "192.168.1.100"
    #   port: 3306
    #   username: "user"
    #   password: "pass"
    #   databases:
    #     - name: whjcbb
    #       description: "决策报表库"
    # - name: nodeB
    #   host: "192.168.1.101"
    #   port: 3306
    #   username: "user"
    #   password: "pass"
    #   databases:
    #     - name: whjcbb
    #       description: "业务库"

# Memory (Mem0) 记忆模块配置
memory:
  # Qdrant 向量存储配置
  qdrant:
    host: "localhost"
    port: 6333
    api_key: ""
    path: "/app/data/qdrant"
    collection_name: "intellibridge_memory"

  # Embedding 配置 (OpenAI 兼容格式)
  embedding:
    base_url: "http://localhost:8000/v1"
    api_key: "sk-test-key"
    model: "text-embedding-3-small"
    dimension: 1024

  # LLM 配置 (用于 add 操作时的记忆提取)
  llm:
    provider: "openai"
    base_url: "http://localhost:8000/v1"
    api_key: "sk-test-key"
    model: "qwen2.5"

  # Reranker 配置 (用于搜索结果排序)
  reranker:
    provider: "llm_reranker"
    base_url: "http://localhost:8000/v1"
    api_key: "sk-test-key"
    model: "qwen2.5"
    top_k: 10
