# IntelliBridge 配置文件

# Hive 连接配置
hive:
  host: "localhost"
  port: 10000
  username: "hive"
  database: "default"
  # 数据库黑名单（list_databases 时不返回这些数据库）
  database_blacklist:
    - default
    - global_temp
    - hxb_dh_data_b
    - hxb_dh_data_i
    - hxb_dh_data_m
    - hxb_dh_data_tmp
    - hxb_dh_data_dm
    - test

# Agent Browser 配置
agent_browser:
  cdp_port: 3000

# MySQL 连接配置
mysql:
  nodes:
    - name: local_node
      host: "localhost"
      port: 3306
      username: "intellibridge"
      password: "intellibridge_password"
      charset: "utf8mb4"
      databases:
        - name: intellibridge
          description: "主数据库，用于系统核心数据存储"
        - name: data_factory
          description: "DolphinScheduler 元数据&血缘数据"

    # 示例：多节点配置（同名数据库需使用不同节点名区分）
    # - name: nodeA
    #   host: "192.168.1.100"
    #   port: 3306
    #   username: "user"
    #   password: "pass"
    #   databases:
    #     - name: whjcbb
    #       description: "决策报表库"
    # - name: nodeB
    #   host: "192.168.1.101"
    #   port: 3306
    #   username: "user"
    #   password: "pass"
    #   databases:
    #     - name: whjcbb
    #       description: "业务库"

# Memory (Mem0) 记忆模块配置
memory:
  # Qdrant 向量存储配置
  qdrant:
    url: "http://localhost:6333"
    api_key: ""
    path: "/app/data/qdrant"
    collection_name: "intellibridge_memory"

  # Embedding 配置 (OpenAI 兼容格式)
  embedding:
    base_url: "http://localhost:8000/v1"
    api_key: "sk-test-key"
    model: "text-embedding-3-small"
    dimension: 1024

  # LLM 配置 (用于 add 操作时的记忆提取)
  llm:
    provider: "openai"
    base_url: "http://localhost:8000/v1"
    api_key: "sk-test-key"
    model: "qwen2.5"

  # Reranker 配置 (用于搜索结果排序)
  reranker:
    provider: "llm_reranker"
    base_url: "http://localhost:8000/v1"
    api_key: "sk-test-key"
    model: "qwen2.5"
    top_k: 10

  graph:
    provider: "neo4j"
    url: "bolt://neo4j:7687"
    username: "neo4j"
    password: "mem0graph"

# DolphinScheduler 配置
dolphin_scheduler:
  # DS 服务地址
  base_url: "http://125.1.129.80:12345/dolphinscheduler"
  # 访问令牌（登录后从 DS 管理界面获取）
  token: "3ee6264f3c5e25af95fc1d482c33ce2c"
  # 允许操作的项目清单（留空表示不限制，非管理员务必按需填写）
  allowed_projects: 
    - 测试
    - 公共每日跑批-分钟级任务
    - 数据标准化

fine_report:
  download_path: '/home/bdspk/hxb_dh/cache/intellibridge'
  browserless_download_path: '/home/bdspk/hxb_dh/cache/browserless_download'
  download_timeout_ms: 60000
  date_widget_names:
    - date
    - sjdate
    - etl_date
    - import_date_tag
  username: 
  password: 
  login_url: 'http://125.1.129.76:8080/fr/'
  cdp_url: 'http://125.1.129.153:10000'