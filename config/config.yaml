# IntelliBridge 配置文件

# 服务级超时
server:
  request_timeout: 600

# Hive 连接配置
hive:
  host: "localhost"
  port: 10000
  username: "hive"
  database: "default"
  max_concurrent: 2
  queue_timeout: 60
  # 数据库黑名单（list_databases 时不返回这些数据库）
  database_blacklist:
    - default
    - global_temp
    - hxb_dh_data_b
    - hxb_dh_data_i
    - hxb_dh_data_m
    - hxb_dh_data_tmp
    - hxb_dh_data_dm
    - test

# Agent Browser 配置
agent_browser:
  cdp_port: 3000

# MySQL 连接配置
mysql:
  pool_acquire_timeout: 30
  connect_timeout: 10
  read_timeout: 60
  write_timeout: 60
  nodes:
    - name: mysql_121
      host: "localhost"
      port: 3306
      username: "root"
      password: "root"
      charset: "utf8mb4"
      databases:
        - name: intellibridge
          description: "主数据库，用于系统核心数据存储"
        - name: data_factory
          description: "DolphinScheduler 元数据&血缘数据"

    # 示例：多节点配置（同名数据库需使用不同节点名区分）
    # - name: nodeA
    #   host: "192.168.1.100"
    #   port: 3306
    #   username: "user"
    #   password: "pass"
    #   databases:
    #     - name: whjcbb
    #       description: "决策报表库"
    # - name: nodeB
    #   host: "192.168.1.101"
    #   port: 3306
    #   username: "user"
    #   password: "pass"
    #   databases:
    #     - name: whjcbb
    #       description: "业务库"

# Memory (Mem0) 记忆模块配置
memory:
  base_url: "http://your-hunchbank-daemon:9321"
  api_token: ""   # 若 daemon 需要认证

# DolphinScheduler 配置
dolphin_scheduler:
  # DS 服务地址
  base_url: "http://125.1.129.80:12345/dolphinscheduler"
  # 访问令牌（登录后从 DS 管理界面获取）
  token: "3ee6264f3c5e25af95fc1d482c33ce2c"
  # 允许操作的项目清单（留空表示不限制，非管理员务必按需填写）
  allowed_projects: 
    - 测试
    - 公共每日跑批-分钟级任务
    - 数据标准化

# Spark SQL 查询性能分析器配置
# 数据源：Spark ThriftServer 的 Spark Web UI REST API（端口 4040）
spark_sql_analyzer:
  enabled: true
  # ThriftServer 的 Spark Web UI 地址（4040 = spark.ui.port）
  base_url: "http://localhost:4040"
  # 拉取新查询的轮询间隔（秒）
  poll_interval_seconds: 30
  # 每次分析后覆盖写的报告文件路径（相对项目根目录）
  report_path: "logs/spark_sql_report.json"
  # diskcache 中保留的最大历史记录条数（超出按时间裁剪）
  history_retention: 5000
  # 慢查询阈值（SQL 级 duration，单位毫秒）
  slow_query_ms: 30000
  # 数据倾斜检测配置
  skew:
    enabled: true
    # task 级 shuffle 字节 max/median 超过此比值判定倾斜
    shuffle_skew_ratio: 4.0
    # task 级 duration max/median 超过此比值判定倾斜
    duration_skew_ratio: 4.0
    # stage 的 task 数少于此值不判倾斜（样本太小，比值不可靠）
    min_tasks_for_skew: 20

fine_report:
  download_path: '/home/bdspk/hxb_dh/cache/intellibridge'
  browserless_download_path: '/home/bdspk/hxb_dh/cache/browserless_download'
  download_timeout_ms: 60000
  date_widget_names:
    - date
    - sjdate
    - etl_date
    - import_date_tag
  username: 
