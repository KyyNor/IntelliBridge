services:
  app:
    build: .
    container_name: intellibridge
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./cache:/app/cache
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
